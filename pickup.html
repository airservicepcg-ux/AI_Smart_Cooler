<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>รับสินค้า | AI Smart Cooler</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    text-align:center;
}

header{
    background:linear-gradient(135deg,#0d6efd,#00c6ff);
    color:white;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    margin-top:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.status{
    color:#28a745;
    font-size:42px;
    font-weight:bold;
    margin-top:20px;
}

.orderText{
    font-size:28px;
    line-height:1.8;
}

.locker-grid{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:30px;
    flex-wrap:wrap;
}

.locker{
    width:80px;
    height:80px;
    border-radius:15px;
    background:#d9d9d9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
}

.active{
    background:#28a745;
    color:white;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0.4;
    }
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:18px 35px;
    background:#28a745;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-size:28px;
    font-weight:bold;
}

.loading{
    font-size:24px;
    color:#666;
}

footer{
    margin:30px;
    color:#888;
}

</style>

</head>

<body>

<header>

<h1>AI Smart Cooler</h1>
<p>ระบบรับสินค้าอัตโนมัติ</p>

</header>

<div class="container">

<div class="card">

<div id="orderInfo" class="loading">

กำลังตรวจสอบคำสั่งซื้อ...

</div>

</div>

<div>

<h2>ตำแหน่ง Locker</h2>

<div class="locker-grid">

<div id="L1" class="locker">L1</div>
<div id="L2" class="locker">L2</div>
<div id="L3" class="locker">L3</div>
<div id="L4" class="locker">L4</div>
<div id="L5" class="locker">L5</div>

</div>

</div>

<a class="btn" href="index.html">
✅ รับสินค้าเรียบร้อย
</a>

</div>

<footer>
© 2026 AI Smart Cooler
</footer>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxr-mefQsURIzn0y5hWC_i6vCgEozKj9dCPO0pHEsP8K1oIheoKPIMgYRJeFpNIntF8/exec";

fetch(API_URL)

.then(response => response.json())

.then(data => {

    document.getElementById("orderInfo").innerHTML = `

        <h2>✅ ตรวจพบคำสั่งซื้อแล้ว</h2>

        <div class="orderText">

        Order No : ${data.orderId}

        <br><br>

        สินค้า :
        ${data.product}

        <br><br>

        Locker :
        <b>${data.locker}</b>

        </div>

        <div class="status">

        🔓 ประตูกำลังเปิด

        </div>

    `;

    const locker =
    document.getElementById(data.locker);

    if(locker){

        locker.classList.add("active");

    }

})

.catch(error => {

    document.getElementById("orderInfo").innerHTML = `

    <h2 style="color:red;">
    ไม่พบคำสั่งซื้อ
    </h2>

    <p>
    กรุณาสั่งซื้อและชำระเงินก่อนรับสินค้า
    </p>

    `;

});

</script>

</body>
</html>
